<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSweet - Saída de Mercadorias</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: var(--cream, #fff8f0);
      font-family: var(--font-family, "Inter", system-ui, sans-serif);
      color: var(--text, #6d5a52);
      margin: 0;
      padding: 0;
    }

    .container-form {
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      background: var(--surface, #ffffff);
      border-radius: var(--radius-lg, 28px);
      box-shadow: var(--shadow, 0 14px 32px rgba(107, 62, 46, 0.1));
      border: 1px solid var(--surface-border, #ecd6d6);
    }

    h2 {
      color: var(--wine, #723c49);
      margin-top: 0;
      font-size: 1.8rem;
    }

    p {
      color: var(--text-muted, #a18974);
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--wine, #723c49);
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      padding: 12px;
      border: 1px solid var(--surface-border, #ecd6d6);
      border-radius: var(--radius-md, 16px);
      background-color: var(--bg, #fff8f0);
      font-size: 1rem;
      color: var(--text-strong, #3d2a24);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      border-color: var(--wine, #723c49);
    }

    .btn-submit {
      background-color: var(--wine, #723c49);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-md, 16px);
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      width: 100%;
      transition: opacity 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .alert {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: var(--radius-sm, 12px);
      display: none;
      font-size: 0.95rem;
    }

    .alert-success { 
      background-color: #d4edda; 
      color: #155724; 
      border: 1px solid #c3e6cb;
    }

    .alert-error { 
      background-color: #f8d7da; 
      color: #721c24; 
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="container-form">
    <h2>Registro de Saída de Mercadorias</h2>
    <p>Registre a baixa de insumos utilizados na produção ou baixas no estoque.</p>

    <!-- Caixa para exibir mensagem de sucesso ou erro -->
    <div id="mensagemFeedback" class="alert"></div>

    <form id="formSaida">
      <!-- Seleção do Insumo -->
      <div class="form-group">
        <label for="selectInsumo">Insumo:</label>
        <select id="selectInsumo" required>
          <option value="">Carregando insumos...</option>
        </select>
      </div>

      <!-- Motivo da Saída -->
      <div class="form-group">
        <label for="selectMotivo">Motivo da Saída:</label>
        <select id="selectMotivo" required>
          <option value="">Selecione o motivo...</option>
          <option value="PRODUCAO">Uso em Produção</option>
          <option value="PERDA_VALIDADE">Validade Vencida</option>
          <option value="AVARIA">Avaria / Danificado</option>
          <option value="OUTRO">Outro Motivo? Se sim, escreva nas observações</option>
        </select>
      </div>

      <!-- Quantidade a dar baixa -->
      <div class="form-group">
        <label for="inputQuantidade">Quantidade Utilizada / Baixada:</label>
        <input type="number" id="inputQuantidade" step="0.01" min="0.01" placeholder="Ex: 2.5" required>
      </div>

      <!-- Observações adicionais -->
      <div class="form-group">
        <label for="inputObservacao">Observação / Detalhes:</label>
        <textarea id="inputObservacao" rows="3" placeholder="Ex: Lote X, Outros Motivos..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSalvar">Registrar Saída</button>
    </form>
  </div>

  <!-- Inclusão do Script de Serviço e Lógica Visual -->
  <script src="js/estoqueService.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const selectInsumo = document.getElementById("selectInsumo");
      const formSaida = document.getElementById("formSaida");
      const mensagemFeedback = document.getElementById("mensagemFeedback");

      // 1. Carregar lista de insumos
      try {
        const insumos = await obterInsumosSimulados();
        selectInsumo.innerHTML = '<option value="">Selecione um insumo...</option>';
        insumos.forEach(item => {
          const option = document.createElement("option");
          option.value = item.idInsumo;
          option.textContent = `${item.nome} (${item.unidadeMedida})`;
          selectInsumo.appendChild(option);
        });
      } catch (err) {
        exibirMensagem("Erro ao carregar insumos.", "error");
      }

      // 2. Submissão do formulário de saída
      formSaida.addEventListener("submit", async (e) => {
        e.preventDefault();

        const novaSaida = {
          tipo: "SAIDA",
          idInsumo: document.getElementById("selectInsumo").value,
          motivo: document.getElementById("selectMotivo").value,
          quantidade: parseFloat(document.getElementById("inputQuantidade").value),
          data: new Date().toISOString().split('T')[0],
          observacao: document.getElementById("inputObservacao").value
        };

        try {
          const resposta = await registrarSaidaSimulada(novaSaida);
          exibirMensagem(resposta.mensagem, "success");
          formSaida.reset();
        } catch (erro) {
          exibirMensagem(erro, "error");
        }
      });

      function exibirMensagem(texto, tipo) {
        mensagemFeedback.textContent = texto;
        mensagemFeedback.className = `alert alert-${tipo === "success" ? "success" : "error"}`;
        mensagemFeedback.style.display = "block";
      }
    });
  </script>
</body>
</html>
