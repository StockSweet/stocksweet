<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Fornecedores · StockSweet</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script>
    // Aplica o tema antes do primeiro desenho pra não piscar claro -> escuro.
    (function () {
      var tema = null;
      try { tema = localStorage.getItem("stocksweet.tema"); } catch (e) {}
      if (tema !== "dark" && tema !== "light") {
        tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = tema;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <!-- layout.js monta a barra lateral e a barra superior em volta deste bloco -->
  <main id="conteudo">
    <noscript><p>Ative o JavaScript para gerenciar fornecedores.</p></noscript>
  </main>

  <script type="module" src="js/paginas/fornecedores.js"></script>
</body>
</html>
